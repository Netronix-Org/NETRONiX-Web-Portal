name: NETRONiX Release

on:
  workflow_run:
    workflows: [NETRONiX CI]
    types: [completed]

permissions: {}

jobs:
  promote:
    name: Fast-forward main to the tested commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: promote-develop
    environment: release-automation
    permissions:
      contents: write
    steps:
      - name: Promote the verified develop commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          git_ref="$repo/git/ref/heads"

          status=$(gh api "$repo/compare/main...$CANDIDATE" --jq '.status')
          case "$status" in
            identical|behind)
              echo "Main already includes $CANDIDATE."
              exit 0
              ;;
            ahead) ;;
            *)
              echo "::error::Develop and main have diverged. Merge main into develop and push the resolved result."
              exit 1
              ;;
          esac

          current=$(gh api "$git_ref/develop" --jq '.object.sha')
          if [[ "$current" != "$CANDIDATE" ]]; then
            echo "Develop moved to $current. Its CI run will handle promotion."
            exit 0
          fi

          # GitHub enforces the required CI check and rejects non-fast-forward
          # updates, including if main changed since the comparison.
          gh api --method PATCH "$repo/git/refs/heads/main" \
            -f sha="$CANDIDATE" -F force=false --jq '.object.sha'
          printf 'Promoted the tested commit `%s` to main.\n' "$CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
