name: NETRONiX CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - name: Smoke-test the admin access boundary
        run: |
          pnpm start --hostname 127.0.0.1 --port 3101 > "$RUNNER_TEMP/next-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          base=http://127.0.0.1:3101
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 1 "$base/admin/login" > /dev/null

          for route in /api/admin/executive /api/admin/registrations /api/admin/ambassadors; do
            actual=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base$route")
            if [[ "$actual" != 401 ]]; then
              echo "::error::$route returned $actual for an unauthenticated request; expected 401."
              exit 1
            fi
          done
